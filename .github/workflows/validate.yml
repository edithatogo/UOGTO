name: Validate UOGTO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up repository Python
      uses: ./.github/actions/project-python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"

    - name: Run validation and tests
      run: |
        make all
        python scripts/maintenance/audit_semantics.py
        python scripts/maintenance/generate_html_report.py
